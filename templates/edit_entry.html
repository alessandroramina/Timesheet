{% extends "base.html" %}
{% block title %}Modifica voce — Timesheet{% endblock %}
{% block content %}

  {% if dry_run %}
    <p class="banner banner-dryrun">Modalità DRY-RUN: la modifica viene solo loggata, nessuna scrittura reale.</p>
  {% endif %}
  {% if error %}<p class="banner banner-error">{{ error }}</p>{% endif %}

  <form method="post" class="card">
    <label for="data">Data</label>
    <input type="date" id="data" name="data" value="{{ entry.data }}" max="{{ today }}" required>

    <label for="ore">Ore lavorate</label>
    <input type="number" id="ore" name="ore" min="0.25" max="24" step="0.25" value="{{ entry.ore }}" required>

    <label for="macro_categoria">Macro Categoria <span class="hint-inline">(filtro Nome Prodotto)</span></label>
    <select id="macro_categoria">
      <option value="">Tutte</option>
      {% for m in macro_categoria_options %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
    </select>

    <label for="categoria_prodotto">Categoria Prodotto <span class="hint-inline">(filtro Nome Prodotto)</span></label>
    <select id="categoria_prodotto">
      <option value="">Tutte</option>
      {% for c in categoria_prodotto_options %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>

    <label for="project_id">Nome Prodotto (progetto)</label>
    <select id="project_id" name="project_id">
      <option value="">—</option>
    </select>
    <input type="hidden" id="project_name" name="project_name" value="{{ entry.progetto_nome }}">

    <label for="note">Note tecniche <span class="hint-inline">(include categoria/attività originali come testo)</span></label>
    <textarea id="note" name="note" rows="3">{{ entry.note }}</textarea>

    <div class="actions">
      <a href="{{ url_for('entries') }}" class="btn-secondary" style="display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:8px;flex:1;">Annulla</a>
      <button type="submit">Salva modifiche</button>
    </div>
  </form>

  <script>
    const PROJECTS = {{ projects | tojson }};
    const CATEGORIA_OPTIONS_ALL = {{ categoria_prodotto_options | tojson }};
    const CURRENT_PROJECT_ID = {{ entry.progetto_id | tojson }};

    const macroSel = document.getElementById('macro_categoria');
    const catProdSel = document.getElementById('categoria_prodotto');
    const projectSel = document.getElementById('project_id');
    const projectNameInput = document.getElementById('project_name');

    function fillProjects() {
      const desired = projectSel.value || CURRENT_PROJECT_ID || '';
      const macro = macroSel.value;
      const cat = catProdSel.value;
      const filtered = PROJECTS.filter(p =>
        (!macro || (p.macro_categoria || '').includes(macro)) &&
        (!cat || (p.categoria_prodotto || '').includes(cat))
      );
      projectSel.innerHTML = '<option value="">—</option>'
        + filtered.map(p => `<option value="${p.id}"${String(desired) === String(p.id) ? ' selected' : ''}>${p.name}</option>`).join('');
      const opt = projectSel.options[projectSel.selectedIndex];
      if (opt.value) projectNameInput.value = opt.text;
    }

    function availableCategorie(macro) {
      if (!macro) return CATEGORIA_OPTIONS_ALL;
      const present = new Set(
        PROJECTS.filter(p => (p.macro_categoria || '').includes(macro) && p.categoria_prodotto)
          .map(p => p.categoria_prodotto)
      );
      const ordered = CATEGORIA_OPTIONS_ALL.filter(c => present.has(c));
      const extra = [...present].filter(c => !CATEGORIA_OPTIONS_ALL.includes(c));
      return ordered.concat(extra);
    }

    function refreshCategoriaOptions() {
      const macro = macroSel.value;
      const current = catProdSel.value;
      const opts = availableCategorie(macro);
      catProdSel.innerHTML = '<option value="">Tutte</option>'
        + opts.map(c => `<option value="${c}"${c === current ? ' selected' : ''}>${c}</option>`).join('');
      if (!opts.includes(current)) catProdSel.value = '';
    }

    macroSel.addEventListener('change', () => { refreshCategoriaOptions(); fillProjects(); });
    catProdSel.addEventListener('change', fillProjects);
    projectSel.addEventListener('change', () => {
      const opt = projectSel.options[projectSel.selectedIndex];
      projectNameInput.value = opt.value ? opt.text : '';
    });

    // Preseleziona la macro/categoria del progetto già collegato, se presente.
    if (CURRENT_PROJECT_ID) {
      const current = PROJECTS.find(p => String(p.id) === String(CURRENT_PROJECT_ID));
      if (current) {
        const primaryMacro = (current.macro_categoria || '').split(',')[0].trim();
        if (primaryMacro && [...macroSel.options].some(o => o.value === primaryMacro)) macroSel.value = primaryMacro;
      }
    }
    refreshCategoriaOptions();
    fillProjects();
  </script>
{% endblock %}
