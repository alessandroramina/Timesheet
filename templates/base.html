<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Timesheet{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>⏱ Timesheet — Ufficio Tecnico</h1>
    {% if user %}
      <span class="user-pill">{{ user.name }} · <a href="{{ url_for('logout') }}">esci</a></span>
    {% endif %}
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% if user %}
      <nav class="tabs">
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' else '' }}">Nuova voce</a>
        <a href="{{ url_for('entries') }}" class="{{ 'active' if request.endpoint in ('entries', 'edit_entry') else '' }}">Le mie voci</a>
      </nav>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
